name: UK lightning optical flashes
on:
  schedule:
    # Hourly. Each run searches a self-healing lookback window:
    # max(6 h, now - last successful scan end + 30 min), capped at 48 h,
    # so a late or failed run is caught up by the next one (GitHub cron
    # drift of 5-141 min was observed; see docs/HISTORY_ONE_YEAR.md).
    - cron: "17 * * * *"
    # Fallback slot. GitHub's scheduler delays and drops runs (27 Oct 2026:
    # only 2 of the 13 hourly slots from 03:17 to 15:17 UTC produced a run).
    # The gate job skips this slot when the :17 run already succeeded, so a
    # dropped :17 costs ~30 min instead of an hour or more.
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Explicit lookback in hours (1-48). Leave empty for the automatic self-healing window."
        default: ""
        required: false

permissions:
  contents: write
  actions: read   # read this run's created_at for the heartbeat (queue time)
  issues: write   # open/update/close the "collector-stale" issue (ci/collector_health.py)

# The hourly feed's own group. NO other workflow may use it: the backfill has
# `uk-lightning-backfill`, so a multi-hour backfill can never queue the hourly
# job (27 Oct 2026: run 40476905747 waited 91 min behind backfill 40464739813
# while both shared `uk-lightning-update`). Within this group a run lasts at
# most timeout-minutes (55), so a queued hourly run waits under an hour; GitHub
# keeps one pending run per group and a newer one replaces it, which is
# harmless because the self-healing lookback covers the skipped slot.
concurrency:
  group: uk-lightning-update
  cancel-in-progress: false

jobs:
  # Cheap guard for the :47 fallback slot: skip when a run succeeded < 40 min ago.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip now, not the SHA the (possibly queued) run was created
          # at: the gate must see the heartbeat of a run that just finished.
          ref: ${{ github.ref }}
          sparse-checkout: |
            status.py
            collect.py
            data/status.json
          sparse-checkout-cone-mode: false
      - name: Decide whether this slot collects
        id: due
        run: |
          python3 status.py due --status data/status.json --event "${{ github.event_name }}" \
            --github-output "$GITHUB_OUTPUT"

  collect:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Record run timing for the heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "JOB_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at 2>/dev/null || true)
          echo "RUN_CREATED_UTC=$created" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Test pure-Python data contracts
        run: python -m unittest discover -s tests -v

      # 1. Collect. Writes the 7-day feed and leaves an uncapped run record in
      #    the runner's temp dir (never committed). The record carries the
      #    examined 10-minute product slots, the searched ranges and the gaps.
      - name: EUMETSAT collection (feed first)
        id: collect
        continue-on-error: true
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          HOURS: ${{ inputs.hours }}
        run: |
          if [ -n "$HOURS" ]; then
            WINDOW=(--hours "$HOURS")
          else
            WINDOW=(--auto-window)
          fi
          python collect.py "${WINDOW[@]}" \
            --out data/uk_lightning.geojson \
            --status data/status.json \
            --history-dir data/history \
            --run-record "$RUNNER_TEMP/lightning-run-record.json"

      # 2. Commit the public feed on its own, before anything touches the archive.
      #    Only this job writes the feed; a rejected push (a backfill commit
      #    landed) is replayed by restoring the saved feed onto the new main.
      - name: Commit latest public GeoJSON (feed commit)
        if: steps.collect.outcome == 'success'
        env:
          # Quick verify of what this commit changes, before every push attempt
          # (also after a replay): nothing malformed reaches main.
          PUSH_VERIFY: python ci/verify_data.py --staged
        run: |
          if git diff --quiet -- data/uk_lightning.geojson; then
            echo "No changed feed output"
            exit 0
          fi
          cp data/uk_lightning.geojson "$RUNNER_TEMP/lightning-feed.geojson"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash ci/push-with-replay.sh "data: refresh UK satellite lightning flash layer" \
            'cp "$RUNNER_TEMP/lightning-feed.geojson" data/uk_lightning.geojson' \
            data/uk_lightning.geojson

      # 3. Append to the one-year UTC archive (index v2 + day shards). A failure
      #    here (for example a shard above max_shard_bytes) never blocks the feed.
      - name: Append to the one-year UTC archive
        id: archive
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: |
          python history.py ingest \
            --archive-dir data/history \
            --run-record "$RUNNER_TEMP/lightning-run-record.json" \
            --seed-scan-windows data/seed_scan_windows.json \
            --result-out "$RUNNER_TEMP/lightning-archive-result.json"
          # Nothing unverified is committed: bytes, sha256 and counts vs the index.
          python history.py verify --archive-dir data/history

      # 4. Always record the outcome: last attempt, last error, consecutive
      #    failures and the last successful scan end the next run looks back to.
      - name: Write data/status.json (always)
        if: always()
        run: |
          python status.py write \
            --status data/status.json \
            --run-record "$RUNNER_TEMP/lightning-run-record.json" \
            --archive-result "$RUNNER_TEMP/lightning-archive-result.json" \
            --collect-outcome "${{ steps.collect.outcome }}" \
            --archive-outcome "${{ steps.archive.outcome }}" \
            --trigger "${{ github.event_name }}" --run-id "${{ github.run_id }}" \
            --run-created "${RUN_CREATED_UTC:-}" --job-started "${JOB_STARTED_UTC:-}"

      # 5. Commit archive and status separately from the feed. If a backfill
      #    pushed in the meantime, the push is rejected and the archive ingest
      #    and status write are REPLAYED on top of the backfill's commit from
      #    the run record (no textual merge of index.json / status.json).
      - name: Commit archive and status (archive commit)
        if: always()
        env:
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          TRIGGER: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          # Quick verify of the staged archive/status before every push attempt
          # (also after a replay). Only the parts this commit changes are
          # checked, so a heartbeat-only commit is never blocked by the archive.
          PUSH_VERIFY: python ci/verify_data.py --staged
        run: |
          if [ "$ARCHIVE_OUTCOME" != "success" ] && [ -d data/history ]; then
            # A failed or unverified archive step is never committed: drop any
            # half-written shard/index and keep the last committed archive.
            git checkout -- data/history 2>/dev/null || true
            git clean -fdq -- data/history
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Paths are staged one by one inside the helper: before the first
          # successful archive write data/history does not exist and a combined
          # pathspec aborts with 128, losing the heartbeat.
          bash ci/push-with-replay.sh "data: archive UTC day shards, index v2 and collector status" \
            'bash ci/replay-hourly-archive.sh' \
            data/status.json data/history

      # 6. Open, refresh or close the "collector-stale" issue from the status
      #    just written (docs/OPERATIONS.md). A fresh heartbeat closes it on
      #    recovery; 3+ consecutive failures (e.g. rejected EUMETSAT
      #    credentials) open it. Monitoring never changes the run's outcome.
      - name: Collector health issue (collector-stale)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: update-lightning run ${{ github.run_id }}
        run: |
          python ci/collector_health.py --status data/status.json --issue \
            --source "$SOURCE" --summary "$GITHUB_STEP_SUMMARY"

      # 7. Make a failed collection or archive visible in the Actions UI even
      #    though the steps above were allowed to continue. A shard_lost
      #    integrity alert also turns the run red, AFTER healthy days and the
      #    status were committed, until `history.py recover` clears it.
      - name: Surface collection, archive or integrity failure
        if: always()
        run: |
          fail=0
          if [ "${{ steps.collect.outcome }}" != "success" ] || [ "${{ steps.archive.outcome }}" = "failure" ]; then
            echo "::error::collect=${{ steps.collect.outcome }} archive=${{ steps.archive.outcome }} (see data/status.json)"
            fail=1
          fi
          python status.py alert --status data/status.json || fail=1
          exit "$fail"
