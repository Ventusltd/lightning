name: UK lightning optical flashes
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours of history to ingest (1-48)"
        default: "3"
        required: false

permissions:
  contents: write

concurrency:
  group: uk-lightning-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Test pure-Python data contracts
        run: python -m unittest discover -s tests -v
      - name: EUMETSAT collection
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          HOURS: ${{ inputs.hours || '3' }}
        run: python collect.py --hours "$HOURS" --history-dir data/history
      - name: Commit latest public GeoJSON
        run: |
          # Stage both tracked and brand-new dated archive shards, then
          # evaluate the staged diff. git diff alone ignores untracked days.
          git add data/uk_lightning.geojson data/history/
          if git diff --cached --quiet; then
            echo "No changed lightning or historical archive data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh UK optical flashes and one-year UTC archive"
          git push
