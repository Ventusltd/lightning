name: Validate UK lightning data pipeline
on:
  push:
    paths:
      - "collect.py"
      - "tests/**"
      - ".github/workflows/test-lightning.yml"
  pull_request:
    paths:
      - "collect.py"
      - "tests/**"
      - ".github/workflows/test-lightning.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
