name: Validate UK lightning data pipeline
on:
  push:
    paths:
      - "collect.py"
      - "history.py"
      - "status.py"
      - "history-window.mjs"
      - "parquet_store.py"
      - "rollups.py"
      - "verify_parquet.py"
      - "sql/**"
      - "sources/**"
      - "tools/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/test-lightning.yml"
  pull_request:
    paths:
      - "collect.py"
      - "history.py"
      - "status.py"
      - "history-window.mjs"
      - "parquet_store.py"
      - "rollups.py"
      - "verify_parquet.py"
      - "sql/**"
      - "sources/**"
      - "tools/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/test-lightning.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Substation extract matches its SHA-256 pin (data-grid-gb)
        run: python tools/extract_substations.py --fetch --check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test archive date-window loader (Node)
        run: node --test tests/test_history_window.mjs
